[package]
name = "logbook-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "axum /health + /ingest collector and browser-capture adapters."

[dependencies]
logbook-core = { workspace = true }
logbook-store = { workspace = true }
# logbook-harness is referenced by path: it is not (yet) declared in
# [workspace.dependencies], and Phase 2 only the collector consumes it (for the
# /v1/hooks adapters). Promote to a workspace dep when a second crate needs it.
logbook-harness = { path = "../logbook-harness" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = "0.8.9"
libc = "0.2.186"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "io-util"] }
tower-http = { version = "0.6.11", features = ["cors"] }

[dev-dependencies]
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "io-util", "test-util"] }
