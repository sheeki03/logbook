[package]
name = "logbook-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PTY capture pipeline (pty / supervisor / clean / paths / parse) — faithful Rust port of the OpenLogs capture engine."

[dependencies]
logbook-core = { version = "0.1.0", path = "../logbook-core" }
logbook-store = { version = "0.1.0", path = "../logbook-store" }
anyhow.workspace = true
futures = "0.3.32"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
once_cell = "1.21.4"
portable-pty = "0.9.0"
regex = "1.12.3"
rustix = { version = "1.1.4", features = ["termios", "stdio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "rt", "sync", "macros", "time", "io-util", "io-std", "process", "signal"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
