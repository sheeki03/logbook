[package]
name = "logbook-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "logbook CLI: run | tail | mcp | proxy | hooks | ui | agent | inventory | revert | session | forget | detect | guard | debug | security | export | hub."

[[bin]]
name = "logbook"
path = "src/main.rs"

[dependencies]
logbook-capture = { version = "0.1.0", path = "../logbook-capture" }
logbook-collector = { version = "0.1.0", path = "../logbook-collector" }
logbook-core = { version = "0.1.0", path = "../logbook-core" }
logbook-debug = { version = "0.1.0", path = "../logbook-debug" }
# logbook-detect powers `logbook detect` + the run-then-detect `logbook guard`
# (the Phase-3 risk rules evaluated over a recorded session's redacted events).
# Referenced by path, matching the other workspace members above.
logbook-detect = { version = "0.1.0", path = "../logbook-detect" }
logbook-export = { version = "0.1.0", path = "../logbook-export" }
# logbook-harness powers `logbook proxy mcp` (the HarnessContext the recording
# MCP transport routes redacted tool payloads through). Referenced by path,
# matching logbook-collector: it is not (yet) a [workspace.dependencies] entry.
logbook-harness = { version = "0.1.0", path = "../logbook-harness" }
logbook-inventory = { version = "0.1.0", path = "../logbook-inventory" }
logbook-mcp = { version = "0.1.0", path = "../logbook-mcp" }
logbook-security = { version = "0.1.0", path = "../logbook-security" }
logbook-store = { version = "0.1.0", path = "../logbook-store" }
logbook-ui = { version = "0.1.0", path = "../logbook-ui" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
