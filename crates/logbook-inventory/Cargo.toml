[package]
name = "logbook-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Endpoint Inventory Lite: agent/MCP discovery, agent wrapper, diff watcher, risk findings (local-only, read-only)."

[dependencies]
logbook-core = { workspace = true }
logbook-store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.38"
similar = { version = "2.7.0", default-features = false, features = ["text"] }
logbook-capture = { version = "0.1.0", path = "../logbook-capture" }
# Read-only discovery of native conversation stores (Cursor/Gemini/Continue) for
# the scan's "Conversation Stores" surface. Path dep (the import crate is not a
# workspace dep); `logbook-import` depends on neither store nor inventory, so
# `inventory → import` is acyclic.
logbook-import = { version = "0.1.0", path = "../logbook-import" }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
