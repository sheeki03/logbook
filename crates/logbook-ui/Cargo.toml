[package]
name = "logbook-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "axum static + SSE server; embeds ui/dist (timeline + inventory tabs)."

[dependencies]
logbook-core.workspace = true
logbook-store.workspace = true
anyhow.workspace = true
axum = { version = "0.8.9", features = ["macros", "tokio", "http1"] }
futures = "0.3.32"
mime_guess = "2.0.5"
rusqlite = "0.38"
rust-embed = { version = "8.11.0", features = ["mime-guess"] }
rustix = { version = "1", features = ["process"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
